name: Bug report
description: Something is wrong, crashes, or reports an implausible number
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Exact command(s) you ran
      render: shell
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: Output of `edgelens doctor`
      description: Includes board, JetPack, runtimes and which telemetry sources work.
      render: text
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Full output / traceback
      render: text
