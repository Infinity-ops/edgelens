[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "edgelens"
version = "0.1.0"
description = "An open-source performance doctor for NVIDIA Jetson AI workloads: stage-level latency attribution + rule-based bottleneck diagnosis."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "EdgeLens contributors" }]
keywords = ["jetson", "nvidia", "edge-ai", "profiling", "tensorrt", "cuda", "benchmark"]
classifiers = [
    # Pre-Alpha, not Alpha: the Jetson-specific code paths (detector.py,
    # telemetry.py's tegrastats parsing) have not yet been run on physical
    # Jetson hardware. Bump to Alpha only once that validation has happened
    # and the ROADMAP.md status note is updated to match — see README.md.
    # NOTE: license uses the TOML-table form `{ text = "MIT" }` on purpose:
    # the SPDX string form needs setuptools>=77, which doesn't support
    # Python 3.8 (Jetson Nano / JetPack 4.x). Newer setuptools accepts the
    # table form with a deprecation warning. Switch to `license = "MIT"`
    # when 3.8 support is dropped. No "License ::" classifier — deprecated.
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Debuggers",
    "Topic :: System :: Hardware",
]
dependencies = [
    "typer>=0.9.0",
    "rich>=13.0.0",
    "psutil>=5.9.0",
    "numpy>=1.21.0",
]

[project.optional-dependencies]
# `onnx` deliberately NOT included here: it's only needed by
# tests/fixtures/make_tiny_model.py (regenerating the test fixture),
# never by pytest itself (which loads the prebuilt tiny_model.onnx via
# onnxruntime only). This matters because onnx>=1.17 pulls in
# protobuf>=6, which broke sibling packages pinned to protobuf 5.x
# (ankaios-sdk, grpcio-tools, wandb) in real-world testing. Only install
# the `fixtures` extra if you're regenerating the .onnx test fixture.
dev = ["pytest>=7.0.0"]
onnx = ["onnxruntime>=1.16.0"]
fixtures = ["onnx>=1.14.0"]

[project.urls]
Homepage = "https://github.com/Infinity-ops/edgelens"
Repository = "https://github.com/Infinity-ops/edgelens"
Issues = "https://github.com/Infinity-ops/edgelens/issues"

[project.scripts]
edgelens = "edgelens.cli:app"

[tool.setuptools.packages.find]
include = ["edgelens*"]
