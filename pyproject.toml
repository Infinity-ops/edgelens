[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "edgelens"
version = "0.1.0"
description = "Measure, diagnose and validate AI pipelines on edge devices: stage-level latency, tail and deadlines, power and energy, evidence-based diagnosis. Deep NVIDIA Jetson support."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "EdgeLens contributors" }]
keywords = ["jetson", "nvidia", "edge-ai", "profiling", "tensorrt", "cuda", "benchmark", "real-time", "energy", "latency", "deadline"]
classifiers = [
    # Alpha: every v0.1.0 hardware path passed scripts/validate_on_jetson.sh
    # on a Jetson Nano (JetPack 4.6). Orin is implemented, not yet validated.
    # NOTE: license uses the TOML-table form `{ text = "MIT" }` on purpose:
    # the SPDX string form needs setuptools>=77, which doesn't support
    # Python 3.8. Newer setuptools accepts the
    # table form with a deprecation warning. Switch to `license = "MIT"`
    # when 3.8 support is dropped. No "License ::" classifier — deprecated.
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: System :: Benchmark",
    "Operating System :: POSIX :: Linux",
    "Topic :: Software Development :: Debuggers",
    "Topic :: System :: Hardware",
]
dependencies = [
    "typer>=0.9.0",
    "rich>=13.0.0",
    "psutil>=5.9.0",
    "numpy>=1.21.0",
]

[project.optional-dependencies]
# `onnx` deliberately NOT included here: it's only needed by
# tests/fixtures/make_tiny_model.py (regenerating the test fixture),
# never by pytest itself (which loads the prebuilt tiny_model.onnx via
# onnxruntime only). This matters because onnx>=1.17 pulls in
# protobuf>=6, which broke sibling packages pinned to protobuf 5.x
# (ankaios-sdk, grpcio-tools, wandb) in real-world testing. Only install
# the `fixtures` extra if you're regenerating the .onnx test fixture.
dev = ["pytest>=7.0.0"]
onnx = ["onnxruntime>=1.16.0"]
fixtures = ["onnx>=1.14.0"]

[project.urls]
Homepage = "https://github.com/Infinity-ops/edgelens"
Repository = "https://github.com/Infinity-ops/edgelens"
Issues = "https://github.com/Infinity-ops/edgelens/issues"
Changelog = "https://github.com/Infinity-ops/edgelens/blob/main/CHANGELOG.md"

[project.scripts]
edgelens = "edgelens.cli:app"

[tool.setuptools.packages.find]
include = ["edgelens*"]
